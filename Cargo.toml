[package]
name = "karyojunc"
version = "0.1.0"
edition = "2024"
description = "Band junctions and band k-mer counts from KaryoScope annotations"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

[profile.release]
lto = true
codegen-units = 1
